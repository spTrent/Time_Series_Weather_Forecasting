services:
  db:
    image: postgres:16
    container_name: weather-pg
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - "weather_pgdata:/var/lib/postgresql/data"
      - "./init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U $${PGDB_USER} -d $${PGDB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
volumes:
  weather_pgdata: