[project]
name = "ts_weather_forecasting"
version = "1.0.0"
description = "Time Series Analysis. Learning DecisionTree, RandomForest, XGBoost"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "pandas>=2.3.3",
    "numpy>=1.26",
    "xgboost>=3.2.0",
    "scikit-learn>=1.7.2",
    "joblib>=1.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "optuna>=4.8.0",
    "pywavelets>=1.8.0",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.0",
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 79
target-version = 'py312'
exclude = [
    'tests/',
    '.venv/',
    '__pycache__',
    'research/ts.ipynb',
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "Q"]
fixable = ['ALL']
ignore = ['E101', 'E501']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = "double"

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.12'
disallow_untyped_defs = true
strict_optional = true
exclude = [
    'tests/',
    '.venv/',
    '__pycache__',
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests/"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/src/config/consts.py"
]
