[project]
name = "ts_weather_forecasting"
version = "1.0.0"
description = "Time Series Analysis. Learning DecisionTree, RandomForest, XGBoost"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "pandas>=2.3.3",
    "numpy>=1.26",
    "xgboost>=3.2.0",
    "scikit-learn>=1.7.2",
    "joblib>=1.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.12",
    "dotenv>=0.9.9",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "optuna>=4.8.0",
    "pywavelets>=1.8.0",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.0",
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
]
